[build]
builder = "DOCKERFILE"
dockerfilePath = "packages/ponder/Dockerfile"
watchPatterns = [
  ".yarn/**",
  ".yarnrc.yml",
  "package.json",
  "yarn.lock",
  "packages/ponder/**",
]

[deploy]
startCommand = "yarn start"
healthcheckPath = "/health/tokenless"
# A fresh isolated protocol schema must backfill from the immutable deployment
# block before the strict tokenless health endpoint will admit the rollout.
healthcheckTimeout = 1800

[deploy.multiRegionConfig]
"europe-west4-drams3a" = { numReplicas = 1 }
