<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RateLoop relaunch announcement card</title>
    <style>
      :root {
        --blue: #359eee;
        --green: #03cea4;
        --yellow: #ffc43d;
        --pink: #ef476f;
        --white: #f5f5f5;
        --spectrum: linear-gradient(
          90deg,
          var(--blue),
          var(--green),
          var(--yellow),
          var(--pink)
        );
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      body {
        color: var(--white);
        font-family:
          Inter,
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        position: relative;
        display: flex;
        width: 100vw;
        height: 100vh;
        flex-direction: column;
        justify-content: space-between;
        overflow: hidden;
        padding: 6.2vh 5.5vw;
        border: 1px solid rgb(245 245 245 / 0.12);
      }

      .brand {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 1rem;
      }

      .mark {
        width: 4rem;
        height: 4rem;
      }

      .brand-name {
        font-family: "Space Grotesk", Inter, ui-sans-serif, sans-serif;
        font-size: 2rem;
        font-weight: 700;
      }

      .content {
        position: relative;
        z-index: 2;
        width: 63%;
        padding-bottom: 2vh;
      }

      .eyebrow {
        margin: 0 0 1.6rem;
        color: rgb(245 245 245 / 0.7);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: 0.22em;
      }

      h1 {
        margin: 0;
        font-family: "Space Grotesk", Inter, ui-sans-serif, sans-serif;
        font-size: clamp(5.5rem, 7.6vw, 8rem);
        font-weight: 700;
        letter-spacing: -0.045em;
        line-height: 0.93;
      }

      .gradient {
        background: var(--spectrum);
        background-clip: text;
        color: transparent;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .thanks {
        max-width: 40rem;
        margin: 2rem 0 0;
        color: rgb(245 245 245 / 0.68);
        font-size: 1.45rem;
        line-height: 1.55;
      }

      .footer {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: rgb(245 245 245 / 0.48);
        font-size: 1rem;
      }

      .accent {
        width: 12rem;
        height: 2px;
        background: var(--spectrum);
      }

      .orb {
        position: absolute;
        top: 50%;
        right: -13%;
        width: 70%;
        aspect-ratio: 1;
        transform: translateY(-50%);
      }

      .orb-line {
        fill: none;
        opacity: calc(0.72 - (var(--i) * 0.019));
        stroke: var(--color);
        stroke-width: 1.1;
        transform-box: view-box;
        transform-origin: 300px 300px;
        transform: rotate(calc(var(--i) * 5.4deg))
          scaleX(calc(0.74 + var(--i) * 0.009))
          scaleY(calc(1.04 - var(--i) * 0.004));
      }
    </style>
  </head>
  <body>
    <article class="card" aria-label="RateLoop relaunch announcement">
      <header class="brand">
        <svg class="mark" viewBox="0 0 128 128" aria-hidden="true">
          <circle
            cx="64"
            cy="64"
            r="43"
            fill="none"
            stroke="url(#logo-spectrum)"
            stroke-width="10"
          />
          <defs>
            <linearGradient
              id="logo-spectrum"
              x1="18"
              y1="23"
              x2="108"
              y2="104"
              gradientUnits="userSpaceOnUse"
            >
              <stop offset="0" stop-color="#359EEE" />
              <stop offset="0.32" stop-color="#03CEA4" />
              <stop offset="0.62" stop-color="#FFC43D" />
              <stop offset="1" stop-color="#EF476F" />
            </linearGradient>
          </defs>
        </svg>
        <span class="brand-name">RateLoop</span>
      </header>

      <div class="content">
        <p class="eyebrow">THE NEXT CHAPTER</p>
        <h1>RateLoop will <span class="gradient">relaunch.</span></h1>
        <p class="thanks">
          Thank you to everyone who contributed, tested early ideas, and shared
          thoughtful feedback.
        </p>
      </div>

      <footer class="footer">
        <span>@RateLoop</span>
        <span class="accent" aria-hidden="true"></span>
        <span>More when it’s ready.</span>
      </footer>
