name: Hosted Tokenless E2E

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Must be exactly https://rateloop-tokenless.vercel.app
        required: true
        type: string
      expected_sha:
        description: Exact lowercase 40-character commit SHA deployed at target_url
        required: true
        type: string
      lane:
        description: Highest-risk lane to run
        required: true
        default: smoke
        type: choice
        options: [smoke, stateful, funded]
      planned_spend_atomic:
        description: Planned total testnet USDC spend in atomic units (funded lane only)
        required: true
        default: "0"
        type: string

permissions:
  contents: read

concurrency:
  group: tokenless-hosted-e2e
  cancel-in-progress: false

jobs:
  hosted-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: tokenless-hosted-e2e
    env:
      E2E_ALLOW_HOSTED_MUTATIONS: ${{ vars.E2E_ALLOW_HOSTED_MUTATIONS }}
      E2E_ALLOW_TESTNET_SPEND: ${{ vars.E2E_ALLOW_TESTNET_SPEND }}
      E2E_BASE_URL: ${{ inputs.target_url }}
      E2E_CHAIN_ID: "84532"
      E2E_EXPECTED_GIT_REF: tokenless
      E2E_EXPECTED_GIT_SHA: ${{ inputs.expected_sha }}
      E2E_KEEPER_URL: ${{ vars.E2E_KEEPER_URL }}
      E2E_PONDER_URL: ${{ vars.E2E_PONDER_URL }}
      E2E_TESTNET_AWARDER_ADDRESS: ${{ vars.E2E_TESTNET_AWARDER_ADDRESS }}
      E2E_TESTNET_FUNDER_ADDRESS: ${{ vars.E2E_TESTNET_FUNDER_ADDRESS }}
      E2E_TESTNET_KEEPER_ADDRESS: ${{ vars.E2E_TESTNET_KEEPER_ADDRESS }}
      E2E_TESTNET_PLANNED_SPEND_ATOMIC: ${{ inputs.planned_spend_atomic }}
      E2E_TESTNET_REVIEWER_PAYOUT_ADDRESS: ${{ vars.E2E_TESTNET_REVIEWER_PAYOUT_ADDRESS }}
      E2E_TESTNET_SPEND_CAP_ATOMIC: ${{ vars.E2E_TESTNET_SPEND_CAP_ATOMIC }}
    steps:
      - name: Checkout the exact requested commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.expected_sha }}
          submodules: true
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: yarn
      - name: Install dependencies
        run: yarn install --immutable
      - name: Validate safety gates and hosted operations
        shell: bash
        env:
          E2E_KEEPER_AUTH_TOKEN: ${{ secrets.E2E_KEEPER_AUTH_TOKEN }}
        run: |
          E2E_CHECKOUT_SHA="$(git rev-parse HEAD)" \
            node packages/nextjs/e2e/hosted/run-preflight.mjs "${{ inputs.lane }}"
      - name: Install Chromium
        run: yarn workspace @rateloop/nextjs exec playwright install --with-deps chromium
      - name: Run exact-deployment smoke
        run: yarn workspace @rateloop/nextjs e2e:hosted:smoke
      - name: Upload Playwright artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: hosted-tokenless-e2e-${{ inputs.lane }}-${{ inputs.expected_sha }}
          path: |
            packages/nextjs/hosted-playwright-report
            packages/nextjs/hosted-test-results
          if-no-files-found: warn
          retention-days: 10
